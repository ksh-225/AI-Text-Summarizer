<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina AI // Text Summarizer</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    
    <style>
        /* CSS Reset & Variable Tokens */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        :root {
            --bg-color: #050505;
            --surface-card: rgba(20, 20, 20, 0.45);
            --surface-glow: rgba(124, 58, 237, 0.03);
            --border-neutral: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02));
            --border-glow: linear-gradient(135deg, rgba(124, 58, 237, 0.4), rgba(3, 181, 211, 0.1));
            --primary: #7C3AED;
            --primary-light: #d2bbff;
            --secondary: #03b5d3;
            --secondary-light: #acedff;
            --success: #00F59B;
            --on-success-container: #76ffc2;
            --error: #ffb4ab;
            --text-main: #e5e2e1;
            --text-dim: #958da1;
            --radius-input: 8px;
            --radius-card: 16px;
            --radius-btn: 12px;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(124, 58, 237, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(3, 181, 211, 0.05) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Top HUD Navigation */
        header {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-text {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, var(--primary-light), var(--secondary-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-version {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 11px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-dim);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* AI Status Badge */
        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 6px 14px;
            border-radius: 9999px;
            font-size: 12px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--success);
            animation: pulse-dot 1.8s infinite ease-in-out;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* Main Workspace Layout (Dashboard Fit) */
        main {
            flex: 1;
            min-height: 0;
            width: 100%;
            max-width: 1200px;
            margin: 16px auto;
            padding: 0 16px;
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 24px;
        }

        @media (max-width: 900px) {
            main {
                grid-template-columns: 1fr;
                overflow-y: auto;
            }
            body {
                height: auto;
                overflow: auto;
            }
        }

        /* Glassmorphic Panels */
        .panel {
            background: var(--surface-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: var(--radius-card);
            padding: 20px;
            position: relative;
            display: flex;
            flex-direction: column;
            height: 100%;
            min-height: 0;
            transition: border 0.3s ease, box-shadow 0.3s ease;
        }

        .panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: inherit;
            padding: 1px;
            background: var(--border-neutral);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .panel.active-glow::before {
            background: var(--border-glow);
        }

        .panel.active-glow {
            box-shadow: 0 0 30px rgba(124, 58, 237, 0.05);
            background: rgba(20, 20, 20, 0.6);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-shrink: 0;
        }

        .panel-label {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Mode Selector (Pill Segmented Control) */
        .mode-selector {
            display: flex;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 4px;
            border-radius: 24px;
            gap: 4px;
            margin-bottom: 16px;
            flex-shrink: 0;
        }

        .mode-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-dim);
            padding: 8px 12px;
            font-size: 13px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 500;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .mode-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.02);
        }

        .mode-btn.active {
            color: #000;
            background: linear-gradient(135deg, var(--primary-light), var(--secondary-light));
            font-weight: 700;
            box-shadow: 0 0 10px rgba(124, 58, 237, 0.2);
        }

        /* Text Input Styling */
        .input-container {
            position: relative;
            background: #000000;
            border-radius: var(--radius-input);
            padding: 2px;
            margin-bottom: 12px;
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .input-container::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: var(--radius-input);
            padding: 1px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.02));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            transition: background 0.3s;
        }

        .input-container:focus-within::after {
            background: var(--border-glow);
        }

        textarea {
            width: 100%;
            flex: 1;
            min-height: 0;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            padding: 16px;
            font-size: 15px;
            line-height: 1.6;
            resize: none;
            caret-color: var(--primary-light);
            overflow-y: auto;
        }

        textarea::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }

        /* HUD Info Bar (Counters) */
        .input-hud-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 11px;
            color: var(--text-dim);
            letter-spacing: 0.05em;
            margin-bottom: 16px;
            flex-shrink: 0;
        }

        .hud-stat-group {
            display: flex;
            gap: 16px;
        }

        .clear-btn {
            background: transparent;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            transition: color 0.2s;
            text-transform: uppercase;
            font-weight: 600;
        }

        .clear-btn:hover {
            color: var(--error);
        }

        /* Action Buttons */
        .primary-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #ffffff;
            border: none;
            padding: 16px;
            font-size: 15px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            border-radius: var(--radius-btn);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .primary-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(124, 58, 237, 0.45);
        }

        .primary-btn:active:not(:disabled) {
            transform: translateY(1px);
        }

        .primary-btn:disabled {
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.25);
            cursor: not-allowed;
            box-shadow: none;
        }

        .primary-btn-shimmer {
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            transition: 0.5s;
        }

        .primary-btn:hover .primary-btn-shimmer {
            left: 100%;
            transition: 0.7s;
        }

        /* Results / Output Panel Styles */
        .output-wrapper {
            display: flex;
            flex-direction: column;
            height: 100%;
            min-height: 0;
            justify-content: space-between;
        }

        .output-content-area {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            position: relative;
            margin-bottom: 20px;
        }

        .placeholder-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            color: var(--text-dim);
            text-align: center;
            gap: 16px;
        }

        .placeholder-icon {
            font-size: 32px;
            opacity: 0.5;
            color: var(--primary-light);
            animation: pulse-icon 2s infinite ease-in-out;
        }

        @keyframes pulse-icon {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.1); }
        }

        /* Circular Progress Area (Directly where output comes) */
        .circular-progress-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            gap: 20px;
        }

        .progress-svg-wrapper {
            position: relative;
            width: 130px;
            height: 130px;
        }

        .circle-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.04);
            stroke-width: 8;
        }

        .circle-fill {
            fill: none;
            stroke: url(#progress-gradient);
            stroke-width: 8;
            stroke-linecap: round;
            stroke-dasharray: 314.16;
            stroke-dashoffset: 314.16;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
            transition: stroke-dashoffset 0.3s ease;
            filter: drop-shadow(0 0 8px rgba(124, 58, 237, 0.5));
        }

        .circle-percentage {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
        }

        .circle-status-text {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 12px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--secondary-light);
            font-weight: 600;
            text-align: center;
        }

        .summary-text-box {
            display: none;
            flex: 1;
            font-size: 15px;
            line-height: 1.7;
            color: #e5e2e1;
            white-space: pre-line;
            overflow-y: auto;
            padding-right: 8px;
            min-height: 0;
        }

        /* Custom Scrollbars */
        textarea::-webkit-scrollbar,
        .summary-text-box::-webkit-scrollbar {
            width: 6px;
        }
        textarea::-webkit-scrollbar-track,
        .summary-text-box::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }
        textarea::-webkit-scrollbar-thumb,
        .summary-text-box::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        /* Statistics Dashboard */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            flex-shrink: 0;
        }

        .stat-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-val {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: var(--secondary-light);
        }

        .stat-label {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 10px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-dim);
        }

        /* Footer styling */
        footer {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 12px 16px;
            text-align: center;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 11px;
            color: var(--text-dim);
            letter-spacing: 0.05em;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <!-- HUD Header -->
    <header>
        <div class="logo-container">
            <span class="logo-text">LUMINA AI</span>
            <span class="logo-version">v1.0.0</span>
        </div>
        <div class="status-badge" id="ai-badge">
            <span class="status-dot" id="badge-dot"></span>
            <span id="badge-text">AI Ready</span>
        </div>
    </header>

    <!-- Main Workspace -->
    <main>
        
        <!-- Left Panel: Input & Modes -->
        <section class="panel active-glow">
            <div class="panel-header">
                <span class="panel-label">
                    <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                        <circle cx="6" cy="6" r="5" stroke="currentColor" stroke-opacity="0.5"/>
                        <circle cx="6" cy="6" r="2" fill="currentColor"/>
                    </svg>
                    Source Content Input
                </span>
            </div>

            <!-- Mode Selector Pills -->
            <div class="mode-selector">
                <button class="mode-btn active" data-mode="Executive Summary">Executive Summary</button>
                <button class="mode-btn" data-mode="Bullet Points">Bullet Points</button>
                <button class="mode-btn" data-mode="TL;DR">TL;DR</button>
            </div>

            <!-- Main Input Area -->
            <div class="input-container">
                <textarea id="dialogue-textarea" placeholder="Paste dialogue transcript or raw document text here to analyze..." required></textarea>
            </div>

            <!-- Interactive HUD Info -->
            <div class="input-hud-info">
                <div class="hud-stat-group">
                    <span>CHARS: <span id="char-counter">0</span></span>
                    <span>WORDS: <span id="word-counter">0</span></span>
                </div>
                <button class="clear-btn" id="clear-textarea-btn">Clear Input</button>
            </div>

            <!-- Primary Generate Button -->
            <button class="primary-btn" id="summarize-btn">
                <span>Summarize Dialogue</span>
                <div class="primary-btn-shimmer"></div>
            </button>
        </section>

        <!-- Right Panel: Results & Circular Progress -->
        <section class="panel" id="result-panel">
            <div class="output-wrapper">
                <div class="output-content-area">
                    <div class="panel-header">
                        <span class="panel-label">
                            <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                                <rect x="1" y="1" width="10" height="10" rx="2" stroke="currentColor" stroke-opacity="0.5"/>
                                <path d="M4 4h4M4 6h4M4 8h2" stroke="currentColor" stroke-linecap="round"/>
                            </svg>
                            Synthesized Output
                        </span>
                    </div>

                    <!-- Placeholder State -->
                    <div class="placeholder-state" id="placeholder-container">
                        <div class="placeholder-icon">✧</div>
                        <p>Feed a document and click summarize to extract neural insights.</p>
                    </div>

                    <!-- Circular Progress Indicator (Shows exactly where output goes) -->
                    <div class="circular-progress-container" id="circle-progress-container">
                        <div class="progress-svg-wrapper">
                            <svg width="130" height="130" viewBox="0 0 120 120">
                                <defs>
                                    <linearGradient id="circle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                                        <stop offset="0%" stop-color="var(--primary)"></stop>
                                        <stop offset="100%" stop-color="var(--secondary)"></stop>
                                    </linearGradient>
                                </defs>
                                <circle class="circle-bg" cx="60" cy="60" r="50"></circle>
                                <circle class="circle-fill" id="progress-circle-fill" cx="60" cy="60" r="50"></circle>
                            </svg>
                            <div class="circle-percentage" id="circle-progress-percent">0%</div>
                        </div>
                        <div class="circle-status-text" id="circle-progress-status">INITIALIZING...</div>
                    </div>

                    <!-- Output Text Box -->
                    <div class="summary-text-box" id="summary-textbox"></div>
                </div>

                <!-- Statistics Dashboard -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <span class="stat-val" id="stat-ratio">--</span>
                        <span class="stat-label">Compression</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-val" id="stat-time">--</span>
                        <span class="stat-label">Latency</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-val" id="stat-words">--</span>
                        <span class="stat-label">Summary Words</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-val" id="stat-speed">--</span>
                        <span class="stat-label">Original Words</span>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- HUD Footer -->
    <footer>
        LUMINA AI PIPELINE OPERATIONAL // LOCAL HOSTING PROTOCOL SECURED
    </footer>

    <script>
        // DOM Elements
        const textInput = document.getElementById('dialogue-textarea');
        const charCount = document.getElementById('char-counter');
        const wordCount = document.getElementById('word-counter');
        const clearBtn = document.getElementById('clear-textarea-btn');
        
        const modeButtons = document.querySelectorAll('.mode-btn');
        const summarizeBtn = document.getElementById('summarize-btn');
        
        const circleProgressContainer = document.getElementById('circle-progress-container');
        const circleProgressPercent = document.getElementById('circle-progress-percent');
        const circleProgressStatus = document.getElementById('circle-progress-status');
        const progressCircleFill = document.getElementById('progress-circle-fill');
        
        const aiBadge = document.getElementById('ai-badge');
        const badgeDot = document.getElementById('badge-dot');
        const badgeText = document.getElementById('badge-text');
        
        const placeholderContainer = document.getElementById('placeholder-container');
        const summaryTextbox = document.getElementById('summary-textbox');
        const resultPanel = document.getElementById('result-panel');
        
        const statRatio = document.getElementById('stat-ratio');
        const statTime = document.getElementById('stat-time');
        const statWords = document.getElementById('stat-words');
        const statSpeed = document.getElementById('stat-speed');

        // State variables
        let selectedMode = 'Executive Summary';

        // Word and Char Counters
        textInput.addEventListener('input', () => {
            const text = textInput.value;
            charCount.textContent = text.length;
            
            const words = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
            wordCount.textContent = words;
        });

        // Clear button handler
        clearBtn.addEventListener('click', () => {
            textInput.value = '';
            charCount.textContent = 0;
            wordCount.textContent = 0;
            textInput.focus();
        });

        // Mode Pill selection
        modeButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                modeButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedMode = btn.getAttribute('data-mode');
            });
        });

        // Typewriter Effect Function
        function animateTypewriter(text, element, speed = 12) {
            element.innerHTML = '';
            element.style.display = 'block';
            let index = 0;
            return new Promise((resolve) => {
                function step() {
                    if (index < text.length) {
                        element.innerHTML += text.charAt(index);
                        index++;
                        element.scrollTop = element.scrollHeight;
                        setTimeout(step, speed);
                    } else {
                        resolve();
                    }
                }
                step();
            });
        }

        // Action Trigger summarization via SSE
        summarizeBtn.addEventListener('click', async () => {
            const dialogue = textInput.value.trim();
            if (!dialogue) return;

            // Reset UI States
            placeholderContainer.style.display = 'none';
            summaryTextbox.style.display = 'none';
            circleProgressContainer.style.display = 'flex';
            resultPanel.classList.add('active-glow');
            
            // Set Badge to Processing
            badgeText.textContent = 'Processing';
            badgeDot.style.backgroundColor = '#7C3AED';
            badgeDot.style.boxShadow = '0 0 10px #7C3AED';
            
            // Disable Inputs
            summarizeBtn.disabled = true;
            textInput.disabled = true;
            modeButtons.forEach(b => b.disabled = true);

            const startTime = performance.now();
            const originalWords = dialogue.split(/\s+/).length;

            // Reset Progress circle
            const circumference = 314.16;
            progressCircleFill.style.strokeDashoffset = circumference;
            circleProgressPercent.textContent = '0%';
            circleProgressStatus.textContent = 'INITIALIZING...';

            try {
                // Call streaming SSE endpoint using fetch POST
                const response = await fetch('/api/summarize-stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ dialogue, mode: selectedMode })
                });

                if (!response.ok) {
                    throw new Error(`Server returned code ${response.status}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop(); // Save partial line to buffer

                    for (const line of lines) {
                        const cleanedLine = line.trim();
                        if (cleanedLine.startsWith('data: ')) {
                            const dataJSON = cleanedLine.slice(6);
                            try {
                                const data = JSON.parse(dataJSON);
                                
                                // Update Progress indicators
                                const progress = data.progress || 0;
                                const status = data.status || '';
                                
                                // Update circle fill offset
                                const offset = circumference - (progress / 100) * circumference;
                                progressCircleFill.style.strokeDashoffset = offset;
                                circleProgressPercent.textContent = `${progress}%`;
                                circleProgressStatus.textContent = status.toUpperCase();

                                if (status === 'complete' || data.summary) {
                                    const summary = data.summary;
                                    const endTime = performance.now();
                                    const durationSec = ((endTime - startTime) / 1000).toFixed(2);
                                    const summaryWords = summary.trim().split(/\s+/).length;
                                    
                                    // Calculate Compression Ratio
                                    const compression = Math.max(0, Math.round((1 - (summaryWords / originalWords)) * 100));

                                    // Render Output Typewriter effect
                                    circleProgressContainer.style.display = 'none';
                                    await animateTypewriter(summary, summaryTextbox, 10);
                                    
                                    // Render Stats Dashboard
                                    statRatio.textContent = `${compression}%`;
                                    statTime.textContent = `${durationSec}s`;
                                    statWords.textContent = summaryWords;
                                    statSpeed.textContent = originalWords;

                                    // Set Badge back to Ready
                                    badgeText.textContent = 'AI Ready';
                                    badgeDot.style.backgroundColor = 'var(--success)';
                                    badgeDot.style.boxShadow = '0 0 10px var(--success)';
                                } else if (status === 'error' || data.error) {
                                    throw new Error(data.error || 'Unknown server error during inference');
                                }
                            } catch (e) {
                                console.error("Error parsing JSON block:", e);
                            }
                        }
                    }
                }
            } catch (err) {
                console.error(err);
                circleProgressContainer.style.display = 'none';
                placeholderContainer.style.display = 'none';
                summaryTextbox.innerHTML = `<span style="color: var(--error)">[SYSTEM ERROR] Failed during inference pipeline:<br>${err.message}</span>`;
                summaryTextbox.style.display = 'block';
                
                // Set Badge to Error State
                badgeText.textContent = 'Error';
                badgeDot.style.backgroundColor = 'var(--error)';
                badgeDot.style.boxShadow = '0 0 10px var(--error)';
                
                // Clear statistics
                statRatio.textContent = '--';
                statTime.textContent = '--';
                statWords.textContent = '--';
                statSpeed.textContent = '--';
            } finally {
                // Re-enable interactive elements
                summarizeBtn.disabled = false;
                textInput.disabled = false;
                modeButtons.forEach(b => b.disabled = false);
                resultPanel.classList.remove('active-glow');
            }
        });
    </script>
</body>
</html>
